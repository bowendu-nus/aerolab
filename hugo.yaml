# Hugo configuration file
title: AERO Lab
baseURL: "https://bowendu-nus.github.io/aerolab/"

# import hextra as module
module:
  imports:
    - path: github.com/imfing/hextra

markup:
  # allow raw html
  goldmark:
    renderer:
      unsafe: true

  # enable hextra syntax highlight
  highlight:
    noClasses: false

menu:
  main:
    - name: Publications
      pageRef: /publications
      weight: 1
    - name: People
      pageRef: /people
      weight: 2
    - name: News
      pageRef: /news
      weight: 3
    - name: Search
      weight: 4
      params:
        type: search
    - name: GScholar
      weight: 5
      url: "https://scholar.google.com/citations?user=yUZN48gAAAAJ&hl=en"
      params:
        icon: academic-cap
    - name: LinkedIn
      weight: 6
      url: "https://www.linkedin.com/in/bowen-du-nus/"
      params:
        icon: linkedin

params:
  navbar:
    displayTitle: true
    displayLogo: true
    logo:
      path: images/logo.svg
      dark: images/logo-dark.svg
      width: 40
      height: 20

  footer:
    displayCopyright: false
    displayPoweredBy: true

  editURL:
    enable: false
    base: "https://github.com/imfing/hextra-starter-template/edit/main/content"
